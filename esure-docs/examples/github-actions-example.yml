# Example: Using ESURE CLI in GitHub Actions
# This workflow demonstrates how to integrate ESURE into your CI pipeline
# to test Stellar payment flows on Testnet

name: Example ESURE Integration Tests

on:
  # Trigger on push to any branch (customize as needed)
  push:
    branches: ["**"]
  # Trigger on pull requests
  pull_request:
  # Allow manual workflow dispatch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Example 1: Run a single bundled scenario
  test-single-scenario:
    name: Test XLM Payment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ESURE CLI
        working-directory: ./esure-cli
        run: |
          npm ci
          npm run build

      - name: Run XLM payment scenario
        run: npx esure run xlm-payment --output json

  # Example 2: Run multiple scenarios with matrix strategy
  test-scenario-matrix:
    name: Test ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      # Continue running other scenarios even if one fails
      fail-fast: false
      matrix:
        scenario:
          - xlm-payment
          - issued-asset-payment
          - missing-trustline
          - insufficient-xlm-balance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ESURE CLI
        working-directory: ./esure-cli
        run: |
          npm ci
          npm run build

      - name: Run scenario
        run: npx esure run ${{ matrix.scenario }} --output json

  # Example 3: Validate and run custom scenario file
  test-custom-scenario:
    name: Test Custom Scenario
    runs-on: ubuntu-latest
    # Only run if custom scenario file exists
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ESURE CLI
        working-directory: ./esure-cli
        run: |
          npm ci
          npm run build

      - name: Validate custom scenario (if exists)
        run: |
          if [ -f ./tests/stellar-custom.yaml ]; then
            npx esure validate ./tests/stellar-custom.yaml
          else
            echo "No custom scenario found, skipping"
          fi

      - name: Run custom scenario (if exists)
        run: |
          if [ -f ./tests/stellar-custom.yaml ]; then
            npx esure run ./tests/stellar-custom.yaml --output json
          else
            echo "No custom scenario found, skipping"
          fi

  # Example 4: Run with retry on Testnet rate limits
  test-with-retry:
    name: Test with Retry Logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ESURE CLI
        working-directory: ./esure-cli
        run: |
          npm ci
          npm run build

      - name: Run scenario with retry
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 10
          command: npx esure run xlm-payment --output json

  # Example 5: Save test results as artifacts
  test-with-artifacts:
    name: Test and Save Results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ESURE CLI
        working-directory: ./esure-cli
        run: |
          npm ci
          npm run build

      - name: Run scenarios and save results
        run: |
          mkdir -p test-results
          npx esure run xlm-payment --output json > test-results/xlm-payment.json || true
          npx esure run issued-asset-payment --output json > test-results/issued-asset.json || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-test-results
          path: test-results/
          retention-days: 30
