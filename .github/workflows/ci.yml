name: Monorepo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per workflow and ref. Superseded pull request runs are cancelled;
# pushes to main are never cancelled, so each push keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: esure-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: esure-backend/package-lock.json
      - run: npm ci --no-workspaces
      - run: npm run check
      - run: npm run build
      - name: Fail if generated API types drift
        run: |
          if ! git diff --exit-code -- src/generated/api-types.ts; then
            echo "src/generated/api-types.ts is out of date."
            echo "Regenerate and commit it with: cd esure-backend && npm run generate:api-types"
            exit 1
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: esure-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: esure-frontend/package-lock.json
      - run: npm ci --no-workspaces
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:prod
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.node-version || 'default' }}
          path: |
            esure-frontend/playwright-report/
            esure-frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  cli:
    name: CLI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            esure-backend/package-lock.json
            esure-cli/package-lock.json
      - name: Install backend dependencies
        working-directory: esure-backend
        run: npm ci --no-workspaces
      - name: Install CLI dependencies
        working-directory: esure-cli
        run: npm ci --no-workspaces
      - name: Typecheck CLI
        working-directory: esure-cli
        run: npm run typecheck
      - name: Test CLI
        working-directory: esure-cli
        run: npm run test
      - name: Build CLI
        working-directory: esure-cli
        run: npm run build

