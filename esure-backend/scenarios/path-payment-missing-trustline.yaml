schemaVersion: 1
id: path-payment-missing-trustline
version: 1
name: Path payment to recipient without destination trustline
description: Create valid Testnet offers but omit the recipient destination-asset trustline so a path payment fails before crediting the destination asset.
network: testnet
accounts:
  - id: sender
    generate: true
    fund: true
  - id: market-maker
    generate: true
    fund: true
  - id: recipient
    generate: true
    fund: true
  - id: issuer
    generate: true
    fund: true
assets:
  - id: xlm
    type: native
  - id: eur
    type: issued
    code: EUR
    issuer: issuer
  - id: usdc
    type: issued
    code: USDC
    issuer: issuer
steps:
  - id: market-maker-trusts-eur
    type: changeTrust
    account: market-maker
    asset: eur
    limit: "1000"
  - id: market-maker-trusts-usdc
    type: changeTrust
    account: market-maker
    asset: usdc
    limit: "1000"
  - id: issuer-funds-market-maker-eur
    type: payment
    from: issuer
    to: market-maker
    asset: eur
    amount: "100"
  - id: issuer-funds-market-maker-usdc
    type: payment
    from: issuer
    to: market-maker
    asset: usdc
    amount: "100"
  - id: offer-eur-for-xlm
    type: manageSellOffer
    account: market-maker
    sellingAsset: eur
    buyingAsset: xlm
    amount: "100"
    price: "1"
  - id: offer-usdc-for-eur
    type: manageSellOffer
    account: market-maker
    sellingAsset: usdc
    buyingAsset: eur
    amount: "100"
    price: "1"
  - id: pay-usdc-without-trustline
    type: pathPaymentStrictReceive
    from: sender
    to: recipient
    sendAsset: xlm
    sendMax: "10"
    destAsset: usdc
    destAmount: "5"
    path:
      - eur
assertions:
  - type: stepFailedWith
    step: pay-usdc-without-trustline
    transactionCode: tx_failed
    operationCodes:
      - op_no_trust
  - type: trustlineMissing
    account: recipient
    asset: usdc
