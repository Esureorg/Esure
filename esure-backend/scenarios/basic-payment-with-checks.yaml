schemaVersion: 1
id: basic-payment-with-checks
version: 1
name: Basic payment with account checks
description: Send XLM between two accounts and verify both accounts exist after the transaction.
network: testnet
accounts:
  - id: source
    generate: true
    fund: true
  - id: destination
    generate: true
    fund: true
assets:
  - id: xlm
    type: native
steps:
  - id: initial-payment
    type: payment
    from: source
    to: destination
    asset: xlm
    amount: "5"
assertions:
  - type: accountExists
    account: source
  - type: accountExists
    account: destination
  - type: stepSucceeded
    step: initial-payment
  - type: balanceChangedBy
    account: destination
    asset: xlm
    amount: "5"
