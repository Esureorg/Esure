schemaVersion: 1
id: minimum-xlm-payment
version: 1
name: Minimum XLM payment
description: Send minimum viable XLM amount (1 stroop = 0.0000001 XLM) to verify small payment handling.
network: testnet
accounts:
  - id: sender
    generate: true
    fund: true
  - id: recipient
    generate: true
    fund: true
assets:
  - id: xlm
    type: native
steps:
  - id: send-minimum-xlm
    type: payment
    from: sender
    to: recipient
    asset: xlm
    amount: "0.0000001"
assertions:
  - type: stepSucceeded
    step: send-minimum-xlm
  - type: balanceChangedBy
    account: recipient
    asset: xlm
    amount: "0.0000001"
